<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c35">
  <title>Contact | Campus Desk</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #172a2b; background: #f5f7f3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { min-height: 68px; padding: 14px max(20px, calc((100% - 1040px) / 2)); display: flex; align-items: center; justify-content: space-between; gap: 20px; color: #eef6f1; background: #173c35; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; text-decoration: none; color: inherit; }
    .mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; color: #173c35; background: #f1c96a; }
    nav { display: flex; gap: 18px; font-size: 12px; }
    nav a { color: #d3e2dc; text-decoration: none; }
    nav a:hover { color: white; text-decoration: underline; }
    main { width: min(940px, calc(100% - 36px)); margin: 60px auto; }
    .intro { max-width: 580px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 8px; color: #176d58; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font-size: 32px; }
    .intro p, .contact-card p { color: #718182; font-size: 14px; line-height: 1.7; }
    .contact-card { max-width: 620px; padding: 26px; border: 1px solid #e4e9e5; border-radius: 8px; background: white; }
    .contact-card h2 { margin: 0 0 7px; font-size: 18px; }
    .contact-card p { margin: 0 0 20px; }
    .contact-link { display: inline-flex; min-height: 42px; align-items: center; padding: 0 15px; border-radius: 6px; color: white; background: #176d58; font-size: 13px; font-weight: 700; text-decoration: none; }
    .contact-link:hover { background: #105341; }
    @media (max-width: 520px) { header { align-items: flex-start; flex-direction: column; } nav { flex-wrap: wrap; gap: 15px; } main { margin-top: 38px; } h1 { font-size: 27px; } .contact-card { padding: 20px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html"><span class="mark">C</span>Campus Desk</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Students</a>
      <a href="register.html">Create account</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>
  <main>
    <section class="intro">
      <p class="eyebrow">We’re here to help</p>
      <h1>Contact Campus Desk</h1>
      <p>Have a question about managing student records? Send us an email and we’ll be glad to help.</p>
    </section>
    <section class="contact-card" aria-labelledby="contact-title">
      <h2 id="contact-title">Email support</h2>
      <p>For account or student-directory questions, contact your school administrator.</p>
      <a class="contact-link" href="mailto:admin@campus.test?subject=Campus%20Desk%20support">Email the administrator</a>
    </section>
  </main>
</body>
</html>
